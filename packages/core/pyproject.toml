[project]
name = "ai-shorts-core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.110",
    "celery[redis]>=5.4",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "structlog>=24.1",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-boto3>=1.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_shorts"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["asyncpg", "celery"]
ignore_missing_imports = true

